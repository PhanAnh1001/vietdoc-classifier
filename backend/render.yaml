# Render Blueprint — VietDoc Classifier Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: vietdoc-classifier
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
    healthCheckPath: /health
    autoDeploy: true
